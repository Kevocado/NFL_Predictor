[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl_predictor"
version = "0.1.0"
description = "NFL game outcome and player prop predictor"
requires-python = ">=3.10"
dependencies = [
    "nfl_data_py>=0.3.2",
    "pandas",
    "numpy",
    "scipy",
    "xgboost",
    "scikit-learn",
    "requests",
    "python-dotenv",
    "fastapi",
    # api/schemas.py imports pydantic directly. It arrives transitively via
    # fastapi today, but a direct import should be a direct declaration.
    "pydantic>=2.9",
    "uvicorn[standard]",
]

[project.optional-dependencies]
# `httpx2` is not a real PyPI package -- `pip install -e ".[dev]"` failed on it.
# FastAPI's TestClient needs `httpx`.
# `ruff` is REQUIRED, not optional: `.github/workflows/tests.yml` runs
# `ruff check` in a gating step, and the `|| (exit 1)` wrapper turns "ruff is not
# installed" into a red build. An earlier version of that workflow only ever
# installed ruff on its `pip install` *fallback* branch -- so fixing `httpx2` in
# this extra disarmed the single line that made the lint step able to run, and CI
# went red on every push. Verified here: with this list unchanged, `ruff` is
# absent from the venv and the step exits 1.
dev = ["pytest", "pytest-mock", "httpx", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
  "network: hits a live upstream API; deselect with '-m \"not network\"'",
]

[tool.ruff]
# This config does NOT make bare `ruff check` equivalent to CI, and an earlier
# version of this comment claimed that it did. It does not: CI runs
# `ruff check src tests --select E9,F63,F7,F82`, i.e. only the import-breaking
# and undefined-name rules. Bare `ruff check` applies ruff's whole default set
# and currently reports ~85 findings, all pre-existing style debt (unused
# imports, line length) in files this work never touched.
#
# So: CI is the gate, and to reproduce it locally run the same command CI runs.
# Narrowing the findings to the selected rules is deliberate -- adopting the full
# default set is 85 findings of unrelated cleanup that would bury a bug fix.
line-length = 120
