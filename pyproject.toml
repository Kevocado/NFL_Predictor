[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl_predictor"
version = "0.1.0"
description = "NFL game outcome and player prop predictor"
requires-python = ">=3.10"
dependencies = [
    "nfl_data_py>=0.3.2",
    "pandas",
    "numpy",
    "scipy",
    "xgboost",
    "scikit-learn",
    "requests",
    "python-dotenv",
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-mock", "httpx2"]

[tool.setuptools.packages.find]
where = ["src"]
