name: Refresh public snapshot

# Runs public_snapshot.py on GitHub's own infrastructure and pushes
# data/public_snapshot.json if it changed. The deploy workflow ignores
# this path (see deploy-azure-nfl.yml's paths-ignore) -- the running
# container instead picks the new snapshot up within
# PUBLIC_SNAPSHOT_POLL_SECONDS by polling this file's raw GitHub URL (see
# api/routes.py::refresh_public_snapshot_from_remote), no redeploy needed.

on:
  schedule:
    # NFL kickoffs run Thu evening through Mon evening (and the odd
    # Saturday in December); every 3 hours during the day, any day, covers
    # a full week without needing a day-of-week split.
    - cron: "20 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# One data-committing job at a time per repo (shared with collect-kalshi-lines.yml), so they queue instead of racing.
concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e .

      # data/cache/ (schedules, player stats -- all gitignored) is what
      # makes repeated runs fast: each season's fetch is cached to its own
      # parquet file. A fresh checkout starts with none of that.
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: data-cache-${{ github.run_id }}
          restore-keys: |
            data-cache-

      - name: Build snapshot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m nfl_predictor.public_snapshot

      # A second, independent check on the file as it now sits in the working
      # tree, so a `main` that is already stale is caught here rather than only
      # being repaired by a build that happens to run. `main` refuses to write a
      # stale payload, so this can only fire if something upstream of it went
      # wrong -- which is the point of having it: it is a different check on a
      # different artifact (the file on disk) than the one inside the writer.
      #
      # This is NOT the enforcement point and is deliberately not treated as one.
      # It runs only on this workflow, and this workflow is bypassable: anyone
      # running `python -m nfl_predictor.public_snapshot` locally never reaches
      # it, and neither does a future writer added by another path. The check that
      # cannot be bypassed is in `public_snapshot.main`, immediately before the
      # `write_text`. Both are here so the failure is loud in the workflow log
      # (with both timestamps and the gap) as well as at the writer.
      - name: Refuse to publish a snapshot older than the models
        run: |
          python -c "
          import json
          from nfl_predictor import config
          from nfl_predictor import public_snapshot as ps
          from nfl_predictor.models import manifest

          snapshot = json.loads(config.PUBLIC_SNAPSHOT_PATH.read_text())
          recorded = manifest.load_manifest()
          print(ps.describe_staleness(snapshot, recorded))
          ps.assert_publishable(snapshot, recorded)
          "

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/public_snapshot.json; then
            echo "No change, nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/public_snapshot.json
          git commit -m "Refresh public snapshot [automated]"
          # The build takes minutes; anything else that lands on main meanwhile (the Kalshi collector, a merge) makes a
          # plain `git push` fail as non-fast-forward and throws the whole build away (seen 2026-10-15, twice). Rebase onto
          # it - -X theirs keeps THIS run's snapshot if two runs ever touched the file - and retry.
          for attempt in 1 2 3 4; do
            git pull --rebase -q -X theirs && git push && exit 0
            echo "push attempt $attempt failed; retrying"; sleep $((attempt * 5))
          done
          echo "could not push after retries"; exit 1
