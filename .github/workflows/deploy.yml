name: Deploy NFL Predictor

on:
# A merge to main deploys. The paths filter is the whole reason this is safe to
# run automatically: it lists what goes INTO the image, and the output of the
# scheduled refresh jobs is deliberately absent, so a data refresh (on a timer,
# several times a day) does not redeploy the service. Those files are polled
# from raw.githubusercontent.com at runtime, so a new snapshot never needs a new
# image.
#
# The filter is a whitelist, so an exclusion cannot be expressed in it: add
# `data/**` and every refresh becomes a deploy. tests/test_deploy_workflow.py
# asserts both halves — that the app's own files are watched, and that the
# refresh jobs' output is not.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'models/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  # To push the image to GHCR as the repo's own actor, using GITHUB_TOKEN. A
  # personal access token would be a credential that outlives the repo and has
  # to be rotated by hand.
  packages: write
  # Only the Azure job uses this, and only when DEPLOY_AZURE is set.
  id-token: write

jobs:
  build:
    name: Build and push the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push NFL Predictor image
        run: |
          docker build -t ghcr.io/kevocado/nfl-predictor:${{ github.sha }} -t ghcr.io/kevocado/nfl-predictor:latest .
          docker push ghcr.io/kevocado/nfl-predictor:${{ github.sha }}
          docker push ghcr.io/kevocado/nfl-predictor:latest


  # Legacy. Azure is being cut over to the VPS, so this stays off unless the
  # repo sets DEPLOY_AZURE=true. Gated on `== 'true'` and not `!= 'false'`:
  # the failing-open form turns Azure back on for every repo that has not
  # explicitly set the variable, which is the opposite of the intent.
  deploy-azure:
    name: Deploy to Azure (legacy)
    needs: build
    if: vars.DEPLOY_AZURE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Azure
        run: |
          az login --service-principal -u "${{ secrets.AZURE_CLIENT_ID }}" -p "${{ secrets.AZURE_CLIENT_SECRET }}" --tenant "${{ secrets.AZURE_TENANT_ID }}"
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Create / Update NFL Predictor Container App
        run: |
          # If the app doesn't exist, create it with external ingress on port 8001
          az containerapp create \
            --name nfl-predictor \
            --resource-group predictor-hub-rg \
            --environment proudbay-f56b8dfa.eastus2 \
            --image ghcr.io/kevocado/nfl-predictor:${{ github.sha }} \
            --target-port 8001 \
            --ingress external \
            --min-replicas 0 \
            --max-replicas 3 \
            --cpu 0.5 \
            --memory 1Gi \
            --env-vars PYTHONPATH=/app/src PUBLIC_MODE=true \
            --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || true

          # If it already exists, just update the image
          az containerapp update \
            --name nfl-predictor \
            --resource-group predictor-hub-rg \
            --image ghcr.io/kevocado/nfl-predictor:${{ github.sha }} \
            --min-replicas 0 \
            --max-replicas 3 || true
          az containerapp ingress enable --name nfl-predictor --resource-group predictor-hub-rg --type external --target-port 8001 || true

  # Pulls the image pushed above on the VPS stack at /opt/stack. `bin/deploy` is
  # the only thing the CI key can ask for -- a forced command in the deploy
  # user's authorized_keys -- and it pins the sha in .env, restarts,
  # health-checks, and rolls back to the previous tag if the new one is unhealthy.
  vps:
    name: Deploy to the VPS
    needs: build
    if: vars.VPS_HOST != ''
    runs-on: ubuntu-latest
    # One deploy at a time per service: two repos pushing at once race on
    # /opt/stack/.env. bin/deploy takes its own lock too; this keeps the queue
    # off the box.
    concurrency: vps-deploy-nfl
    steps:
      - name: Deploy to VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          # Written before the first connection, or ssh prompts to confirm the
          # host key and the job hangs until it times out.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh deploy@${{ vars.VPS_HOST }} deploy nfl ${{ github.sha }}
